services:
  db:
    image: postgres:16-alpine
    env_file:
      - ../.env
    volumes:
      - datos_pg:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../infra/backend.Dockerfile
    env_file:
      - ../.env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - ../media:/app/media
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../frontend
      dockerfile: ../infra/frontend.Dockerfile
    env_file:
      - ../.env
    volumes:
      - ../frontend:/app
      - node_modules:/app/node_modules
    ports:
      - "4200:4200"

volumes:
  datos_pg:
  node_modules:
