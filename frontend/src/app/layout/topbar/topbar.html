<header class="flex h-14 items-center justify-between border-b border-neutro-200 bg-white px-4">
  <div class="flex items-center gap-3">
    <span class="text-lg font-semibold text-teal-600">Seguimiento TI</span>
  </div>

  <div class="flex-1 px-6">
    <label class="relative mx-auto block max-w-md">
      <span class="sr-only">Buscar</span>
      <input
        type="search"
        placeholder="Buscar (próximamente)"
        disabled
        title="La búsqueda global llega en una fase posterior"
        class="
          w-full
          rounded-panel
          border border-neutro-200
          bg-neutro-50
          px-3 py-1.5
          text-sm
          text-neutro-400
          placeholder:text-neutro-400
          disabled:cursor-not-allowed
          transition-colors duration-150
        "
      />
    </label>
  </div>

  <div class="relative" data-menu-usuario>
    <button
      type="button"
      class="
        flex items-center gap-2
        rounded-panel px-2 py-1.5
        text-sm
        transition-colors duration-150
        hover:bg-teal-50
        focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-500
      "
      [attr.aria-expanded]="menuAbierto()"
      aria-haspopup="menu"
      (click)="alternarMenu()"
    >
      <span class="flex h-8 w-8 items-center justify-center rounded-full bg-teal-100 text-sm font-semibold text-teal-700">
        {{ auth.usuario()?.nombres?.charAt(0) ?? '?' }}
      </span>
      <span class="hidden flex-col text-left sm:flex">
        <span class="font-medium text-neutro-800">{{ auth.usuario()?.nombres }} {{ auth.usuario()?.apellidos }}</span>
        <span class="text-xs text-neutro-500">{{ auth.usuario()?.roles?.join(', ') }}</span>
      </span>
    </button>

    @if (menuAbierto()) {
      <div
        role="menu"
        class="
          absolute right-0 top-full mt-1 w-56
          rounded-panel border border-neutro-200
          bg-white py-1
          shadow-hover
        "
      >
        <a
          role="menuitem"
          routerLink="/perfil"
          class="block px-4 py-2 text-sm text-neutro-700 transition-colors duration-150 hover:bg-teal-50"
          (click)="menuAbierto.set(false)"
        >
          Mi perfil
        </a>
        <a
          role="menuitem"
          routerLink="/auth/cambiar-clave"
          class="block px-4 py-2 text-sm text-neutro-700 transition-colors duration-150 hover:bg-teal-50"
          (click)="menuAbierto.set(false)"
        >
          Cambiar contraseña
        </a>
        <button
          role="menuitem"
          type="button"
          class="block w-full px-4 py-2 text-left text-sm text-peligro transition-colors duration-150 hover:bg-peligro/5"
          (click)="salir()"
        >
          Salir
        </button>
      </div>
    }
  </div>
</header>
