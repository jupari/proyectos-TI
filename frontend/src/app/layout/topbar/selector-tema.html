<div class="relative" data-selector-tema>
  <button
    type="button"
    class="
      flex h-9 w-9 items-center justify-center rounded-panel
      text-neutro-600 transition-colors duration-150
      hover:bg-primario-50 hover:text-primario-700
      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primario-500
    "
    aria-label="Apariencia"
    title="Apariencia"
    aria-haspopup="dialog"
    [attr.aria-expanded]="abierto()"
    (click)="abierto.set(!abierto())"
  >
    <svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M12 3a9 9 0 100 18c1.1 0 2-.9 2-2 0-.5-.2-1-.5-1.3-.3-.4-.5-.8-.5-1.3 0-1.1.9-2 2-2h2.3a3.7 3.7 0 003.7-3.7C21 6.6 17 3 12 3z" />
      <circle cx="7.5" cy="11" r="1" fill="currentColor" />
      <circle cx="10" cy="7" r="1" fill="currentColor" />
      <circle cx="15" cy="7" r="1" fill="currentColor" />
    </svg>
  </button>

  @if (abierto()) {
    <div
      role="dialog"
      aria-label="Apariencia"
      class="absolute right-0 top-full z-30 mt-1 w-64 rounded-panel border border-neutro-200 bg-surface p-4 shadow-hover"
    >
      <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-primario-800">Modo</p>
      <div class="mb-4 grid grid-cols-3 gap-1 rounded-panel bg-neutro-100 p-1" role="radiogroup" aria-label="Modo de color">
        @for (modo of modos; track modo.valor) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="tema.modo() === modo.valor"
            class="rounded-input px-2 py-1.5 text-xs font-medium transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primario-500"
            [class.bg-surface]="tema.modo() === modo.valor"
            [class.shadow-tarjeta]="tema.modo() === modo.valor"
            [class.text-neutro-900]="tema.modo() === modo.valor"
            [class.text-neutro-500]="tema.modo() !== modo.valor"
            (click)="tema.elegirModo(modo.valor)"
          >
            <span aria-hidden="true">{{ modo.icono }}</span> {{ modo.etiqueta }}
          </button>
        }
      </div>

      <p class="mb-2 text-xs font-semibold uppercase tracking-wide text-primario-800">Color</p>
      <div class="grid grid-cols-3 gap-2" role="radiogroup" aria-label="Color del tema">
        @for (opcion of tema.temas; track opcion.id) {
          <button
            type="button"
            role="radio"
            [attr.aria-checked]="tema.tema() === opcion.id"
            class="flex flex-col items-center gap-1 rounded-panel border p-2 text-xs transition-colors focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primario-500"
            [class.border-primario-500]="tema.tema() === opcion.id"
            [class.bg-primario-50]="tema.tema() === opcion.id"
            [class.border-neutro-200]="tema.tema() !== opcion.id"
            (click)="tema.elegirTema(opcion.id)"
          >
            <span
              class="flex h-6 w-6 items-center justify-center rounded-full text-[11px] text-white"
              [style.background-color]="opcion.muestra"
              aria-hidden="true"
            >
              @if (tema.tema() === opcion.id) {
                ✓
              }
            </span>
            <span class="text-neutro-700">{{ opcion.nombre }}</span>
          </button>
        }
      </div>
    </div>
  }
</div>
