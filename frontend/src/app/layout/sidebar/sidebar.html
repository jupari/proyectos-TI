<aside
  class="flex h-full flex-col border-r border-neutro-200 bg-neutro-50 transition-all"
  [class.w-56]="!colapsado()"
  [class.w-16]="colapsado()"
>
  <nav class="flex-1 overflow-y-auto py-4">
    <ul class="flex flex-col gap-2 px-3">
      @for (item of items(); track item.ruta) {
        <li>
          <a
            [routerLink]="item.ruta"
            routerLinkActive="bg-teal-50 text-teal-700 border-l-4 border-teal-500 pl-2"
            class="
              flex items-center gap-3
              rounded-panel px-3 py-2.5
              text-sm font-medium
              text-neutro-700
              transition-colors duration-150
              hover:bg-teal-100
              focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-teal-500
            "
          >
            <span aria-hidden="true" class="text-lg">{{ item.icono }}</span>
            @if (!colapsado()) {
              <span class="flex-1">{{ item.etiqueta }}</span>
              @if (contadorDe(item.ruta) > 0) {
                <span class="rounded-full bg-peligro px-2 py-1 text-xs font-semibold text-white">
                  {{ contadorDe(item.ruta) }}
                </span>
              }
            }
          </a>
        </li>
      }
    </ul>
  </nav>
  <button
    type="button"
    class="
      border-t border-neutro-200
      px-3 py-2.5
      text-left text-sm
      text-neutro-600
      transition-colors duration-150
      hover:bg-teal-50
      focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-teal-500
    "
    [attr.aria-label]="colapsado() ? 'Expandir menú' : 'Colapsar menú'"
    (click)="alternarColapso()"
  >
    {{ colapsado() ? '»' : '« Colapsar' }}
  </button>
</aside>
