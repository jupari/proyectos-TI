<aside
  class="flex h-full flex-col border-r border-neutro-200 bg-neutro-50 transition-[width] duration-200"
  [class.w-56]="!colapsado()"
  [class.w-16]="colapsado()"
>
  <nav class="flex-1 overflow-y-auto py-4">
    <ul class="flex flex-col gap-2 px-3">
      @for (item of items(); track item.ruta) {
        <li>
          <a
            [routerLink]="item.ruta"
            [title]="colapsado() ? item.etiqueta : ''"
            [attr.aria-current]="esActivo(item.ruta) ? 'page' : null"
            [class.bg-primario-50]="esActivo(item.ruta)"
            [class.text-primario-700]="esActivo(item.ruta)"
            [class.border-l-4]="esActivo(item.ruta)"
            [class.border-primario-500]="esActivo(item.ruta)"
            [class.pl-2]="esActivo(item.ruta)"
            class="
              flex items-center gap-3
              rounded-panel px-3 py-2.5
              text-sm font-medium
              text-neutro-700
              transition-colors duration-150
              hover:bg-primario-100
              focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-offset-2 focus-visible:ring-primario-500
            "
          >
            <span aria-hidden="true" class="text-lg">{{ item.icono }}</span>
            @if (!colapsado()) {
              <span class="flex-1">{{ item.etiqueta }}</span>
              @if (contadorDe(item.ruta) > 0) {
                <span class="rounded-full bg-peligro px-2 py-1 text-xs font-semibold text-white">
                  {{ contadorDe(item.ruta) }}
                </span>
              }
            }
          </a>
        </li>
      }
    </ul>
  </nav>
  <div class="border-t border-neutro-200 p-3">
    <button
      type="button"
      class="
        flex w-full items-center gap-3 rounded-panel px-3 py-2.5
        text-sm font-medium text-neutro-600
        transition-colors duration-150
        hover:bg-primario-50 hover:text-primario-700
        focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-primario-500
      "
      [class.justify-center]="colapsado()"
      [attr.aria-label]="colapsado() ? 'Expandir menú' : 'Contraer menú'"
      [attr.aria-expanded]="!colapsado()"
      [title]="colapsado() ? 'Expandir menú' : 'Contraer menú'"
      (click)="alternarColapso()"
    >
      <svg
        class="h-5 w-5 shrink-0 transition-transform duration-200"
        [class.rotate-180]="colapsado()"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        aria-hidden="true"
      >
        <path d="M11 17l-5-5 5-5" />
        <path d="M18 17l-5-5 5-5" />
      </svg>
      @if (!colapsado()) {
        <span>Contraer menú</span>
      }
    </button>
  </div>
</aside>
