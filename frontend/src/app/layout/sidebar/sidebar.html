<aside
  class="flex h-full flex-col border-r border-neutro-200 bg-white transition-all"
  [class.w-56]="!colapsado()"
  [class.w-16]="colapsado()"
>
  <nav class="flex-1 overflow-y-auto py-3">
    <ul class="flex flex-col gap-1 px-2">
      @for (item of items(); track item.ruta) {
        <li>
          <a
            [routerLink]="item.ruta"
            routerLinkActive="bg-marca-50 text-marca-700"
            class="flex items-center gap-3 rounded-panel px-3 py-2 text-sm font-medium text-neutro-600
              hover:bg-neutro-100 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-marca-500"
          >
            <span aria-hidden="true">{{ item.icono }}</span>
            @if (!colapsado()) {
              <span>{{ item.etiqueta }}</span>
            }
          </a>
        </li>
      }
    </ul>
  </nav>
  <button
    type="button"
    class="border-t border-neutro-200 px-3 py-2 text-left text-sm text-neutro-500 hover:bg-neutro-50"
    [attr.aria-label]="colapsado() ? 'Expandir menú' : 'Colapsar menú'"
    (click)="alternarColapso()"
  >
    {{ colapsado() ? '»' : '« Colapsar' }}
  </button>
</aside>
