<div class="flex flex-col gap-4">
  <div class="flex items-center justify-between">
    <h1 class="text-lg font-semibold text-neutro-800">Proyectos</h1>
    @if (puedeCrear()) {
      <app-boton routerLink="/proyectos/nuevo">+ Nuevo proyecto</app-boton>
    }
  </div>

  <div class="grid grid-cols-1 gap-3 rounded-panel border border-neutro-200 bg-white p-4 shadow-tarjeta sm:grid-cols-2 lg:grid-cols-4">
    <app-input
      etiqueta="Buscar"
      placeholder="Código o nombre…"
      [ngModel]="busqueda()"
      (ngModelChange)="busqueda.set($event)"
      (keydown.enter)="aplicarFiltros()"
    />
    <app-select
      etiqueta="Estado"
      [opciones]="opcionesEstado"
      [limpiable]="true"
      [ngModel]="estado()"
      (ngModelChange)="estado.set($event); aplicarFiltros()"
    />
    <app-select
      etiqueta="Prioridad"
      [opciones]="opcionesPrioridad"
      [limpiable]="true"
      [ngModel]="prioridad()"
      (ngModelChange)="prioridad.set($event); aplicarFiltros()"
    />
    <app-select
      etiqueta="Semáforo"
      [opciones]="opcionesSemaforo"
      [limpiable]="true"
      [ngModel]="semaforo()"
      (ngModelChange)="semaforo.set($event); aplicarFiltros()"
    />
    <app-select
      etiqueta="Portafolio"
      [opciones]="opcionesPortafolios()"
      [limpiable]="true"
      [ngModel]="portafolio()"
      (ngModelChange)="portafolio.set($event); aplicarFiltros()"
    />
    <app-select
      etiqueta="Área"
      [opciones]="opcionesAreas()"
      [limpiable]="true"
      [ngModel]="area()"
      (ngModelChange)="area.set($event); aplicarFiltros()"
    />
    <div class="flex items-end gap-2">
      <app-switch
        etiqueta="Solo mis proyectos"
        [ngModel]="soloMisProyectos()"
        (ngModelChange)="soloMisProyectos.set($event); aplicarFiltros()"
      />
    </div>
    <div class="flex items-end justify-end">
      <app-boton variante="secundario" (clic)="limpiarFiltros()">Limpiar filtros</app-boton>
    </div>
  </div>

  <ng-template #colEstado let-fila>
    <app-badge [valor]="fila.estado" [etiqueta]="fila.estado | etiquetaEnum: ETIQUETAS_ESTADO_PROYECTO" />
  </ng-template>
  <ng-template #colPrioridad let-fila>
    <app-badge [valor]="fila.prioridad" />
  </ng-template>
  <ng-template #colInicio let-fila>
    {{ fila.fecha_inicio_plan | fechaCorta }}
  </ng-template>
  <ng-template #colFin let-fila>
    {{ fila.fecha_fin_plan | fechaCorta }}
  </ng-template>
  <ng-template #colAvance let-fila>
    <app-progreso [valor]="numero(fila.avance_reportado)" class="block w-28" />
  </ng-template>
  <ng-template #colPctHoras let-fila>
    {{ fila.resumen_ejecucion.pct_horas | porcentaje }}
  </ng-template>
  <ng-template #colPctDinero let-fila>
    {{ fila.resumen_ejecucion.pct_dinero | porcentaje }}
  </ng-template>
  <ng-template #colSemaforo let-fila>
    <app-semaforo [valor]="esValorSemaforo(fila.semaforo)" [mostrarTexto]="false" />
  </ng-template>
  <ng-template #colAcciones let-fila>
    <a [routerLink]="['/proyectos', fila.id]" class="text-sm font-medium text-marca-600 hover:underline">
      Ver
    </a>
  </ng-template>

  <app-tabla
    [columnas]="[
      columnas[0],
      columnas[1],
      columnas[2],
      columnas[3],
      { clave: 'estado', titulo: 'Estado', plantilla: colEstado },
      { clave: 'prioridad', titulo: 'Prioridad', plantilla: colPrioridad },
      { clave: 'fecha_inicio_plan', titulo: 'Inicio', ordenable: true, plantilla: colInicio },
      { clave: 'fecha_fin_plan', titulo: 'Fin', ordenable: true, plantilla: colFin },
      { clave: 'avance', titulo: 'Avance', plantilla: colAvance },
      { clave: 'pct_horas', titulo: '% horas', alinear: 'derecha', plantilla: colPctHoras },
      { clave: 'pct_dinero', titulo: '% dinero', alinear: 'derecha', plantilla: colPctDinero },
      { clave: 'semaforo', titulo: 'Semáforo', alinear: 'centro', plantilla: colSemaforo },
      { clave: 'acciones', titulo: '', alinear: 'derecha', plantilla: colAcciones }
    ]"
    [filas]="respuesta()?.results ?? []"
    [cargando]="cargando()"
    [respuesta]="respuesta()"
    [paginaActual]="paginaActual()"
    [ordenActual]="ordenActual()"
    mensajeVacio="No hay proyectos que coincidan con los filtros."
    (cambioOrden)="alCambiarOrden($event)"
    (cambioPagina)="alCambiarPagina($event)"
  />
</div>
