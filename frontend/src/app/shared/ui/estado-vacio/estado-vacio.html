<div class="flex flex-col items-center gap-3 py-6 text-center">
  <svg class="h-12 w-12 text-teal-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
    <path
      stroke-linecap="round"
      stroke-linejoin="round"
      stroke-width="1.5"
      d="M3 7.5l1.5-3h15l1.5 3M3 7.5v10.5A2 2 0 005 20h14a2 2 0 002-2V7.5M3 7.5h18M9 12h6"
    />
  </svg>
  <p class="text-sm text-neutro-500">{{ mensaje() }}</p>
  <ng-content />
  @if (textoAccion()) {
    <app-boton variante="secundario" tamano="sm" (clic)="accion.emit()">
      {{ textoAccion() }}
    </app-boton>
  }
</div>
