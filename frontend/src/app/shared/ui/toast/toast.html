<div class="fixed top-4 right-4 z-50 flex w-80 flex-col gap-2" aria-live="polite" role="status">
  @for (mensaje of servicio.mensajes(); track mensaje.id) {
    <div
      class="flex items-start gap-2 rounded-panel border bg-white px-3 py-2 shadow-hover"
      [class]="clase[mensaje.tipo]"
    >
      <span class="font-bold" aria-hidden="true">{{ icono[mensaje.tipo] }}</span>
      <p class="flex-1 text-sm text-neutro-800">{{ mensaje.mensaje }}</p>
      <button
        type="button"
        aria-label="Cerrar notificación"
        class="text-neutro-400 hover:text-neutro-700 focus-visible:outline-none
          focus-visible:ring-2 focus-visible:ring-teal-500 rounded"
        (click)="servicio.cerrar(mensaje.id)"
      >
        ✕
      </button>
    </div>
  }
</div>
