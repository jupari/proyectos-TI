<div role="tablist" class="flex gap-1 border-b border-neutro-200">
  @for (pestana of pestanas(); track pestana.id; let i = $index) {
    <button
      type="button"
      role="tab"
      [id]="idBoton(pestana.id)"
      [attr.aria-selected]="pestana.id === activa()"
      [tabindex]="pestana.id === activa() ? 0 : -1"
      class="-mb-px border-b-2 px-4 py-2 text-sm font-medium focus-visible:outline-none
        focus-visible:ring-2 focus-visible:ring-teal-500 rounded-t"
      [class.border-teal-600]="pestana.id === activa()"
      [class.text-teal-700]="pestana.id === activa()"
      [class.border-transparent]="pestana.id !== activa()"
      [class.text-neutro-500]="pestana.id !== activa()"
      (click)="seleccionar(pestana.id)"
      (keydown)="alTecla($event, i)"
    >
      {{ pestana.etiqueta }}
    </button>
  }
</div>
