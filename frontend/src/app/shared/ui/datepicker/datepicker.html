<div class="flex flex-col gap-1 relative" [attr.data-datepicker-id]="id">
  @if (etiqueta()) {
    <label [for]="id" class="text-sm font-medium text-neutro-700">{{ etiqueta() }}</label>
  }
  <div class="flex items-stretch overflow-hidden rounded-panel border border-neutro-300 bg-white
    focus-within:ring-2 focus-within:ring-teal-500 focus-within:border-teal-500"
    [class.border-peligro]="!!error()"
  >
    <input
      [id]="id"
      type="text"
      placeholder="dd/mm/aaaa"
      [disabled]="deshabilitado()"
      [value]="textoVisual()"
      class="w-full min-w-0 border-0 bg-transparent px-3 py-2 text-sm text-neutro-900
        placeholder:text-neutro-400 focus:outline-none disabled:cursor-not-allowed disabled:opacity-50"
      (input)="alEscribirTexto($event)"
      (keydown)="alTeclaCampo($event)"
      (blur)="alTocar()"
    />
    <button
      type="button"
      aria-label="Abrir calendario"
      [disabled]="deshabilitado()"
      class="px-3 text-neutro-500 hover:text-neutro-700 disabled:cursor-not-allowed disabled:opacity-50"
      (click)="alternar()"
    >
      <svg class="h-4 w-4" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
        <path
          fill-rule="evenodd"
          d="M5.75 2.5a.75.75 0 01.75.75V4h7V3.25a.75.75 0 011.5 0V4h.5A2.5 2.5 0 0118 6.5v8A2.5 2.5 0 0115.5 17h-11A2.5 2.5 0 012 14.5v-8A2.5 2.5 0 014.5 4H5V3.25a.75.75 0 01.75-.75zM3.5 8v6.5A1 1 0 004.5 15.5h11a1 1 0 001-1V8h-13z"
          clip-rule="evenodd"
        />
      </svg>
    </button>
  </div>

  @if (abierto()) {
    <div
      role="application"
      aria-label="Calendario"
      class="absolute z-10 top-full mt-1 w-72 rounded-panel border border-neutro-200 bg-white p-3 shadow-tarjeta"
    >
      <div class="flex items-center justify-between pb-2">
        <button type="button" aria-label="Mes anterior" class="p-1 text-neutro-500 hover:text-neutro-800" (click)="mesAnterior()">
          ‹
        </button>
        <span class="text-sm font-medium capitalize">{{ etiquetaMes() }}</span>
        <button type="button" aria-label="Mes siguiente" class="p-1 text-neutro-500 hover:text-neutro-800" (click)="mesSiguiente()">
          ›
        </button>
      </div>
      <div class="grid grid-cols-7 gap-1 text-center text-xs text-neutro-400 pb-1">
        @for (nombre of nombresDia; track nombre) {
          <span>{{ nombre }}</span>
        }
      </div>
      <div role="grid" class="grid grid-cols-7 gap-1">
        @for (dia of dias(); track dia.iso) {
          <button
            type="button"
            role="gridcell"
            [attr.aria-selected]="dia.iso === valorIso()"
            [attr.aria-disabled]="dia.deshabilitado"
            [disabled]="dia.deshabilitado"
            class="rounded-panel py-1 text-sm hover:bg-teal-50 focus-visible:outline-none
              focus-visible:ring-2 focus-visible:ring-teal-500 disabled:cursor-not-allowed
              disabled:opacity-30 disabled:hover:bg-transparent"
            [class.text-neutro-400]="!dia.delMesActual"
            [class.bg-teal-700]="dia.iso === valorIso()"
            [class.text-white]="dia.iso === valorIso()"
            (click)="elegirDia(dia)"
          >
            {{ dia.numero }}
          </button>
        }
      </div>
    </div>
  }

  @if (error()) {
    <p class="text-sm text-peligro">{{ error() }}</p>
  } @else if (ayuda()) {
    <p class="text-sm text-neutro-500">{{ ayuda() }}</p>
  }
</div>
