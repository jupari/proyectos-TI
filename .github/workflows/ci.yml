# Integración continua. Ramas: `develop` -> QA, `master` -> producción.
# Render despliega cada entorno con `autoDeployTrigger: checksPass` (ver
# render.yaml): solo publica un commit si los checks de este workflow pasan.
name: CI

on:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: seguimiento
          POSTGRES_USER: seguimiento
          POSTGRES_PASSWORD: seguimiento
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U seguimiento"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DJANGO_SECRET_KEY: ci-solo-para-pruebas
      POSTGRES_DB: seguimiento
      POSTGRES_USER: seguimiento
      POSTGRES_PASSWORD: seguimiento
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: pytest -q --cov

  frontend:
    name: Frontend (lint + test + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test -- --watch=false
      - run: npm run build

  origen-master:
    name: Solo develop o hotfix/* hacia master
    if: github.event_name == 'pull_request' && github.base_ref == 'master'
    runs-on: ubuntu-latest
    steps:
      - name: Validar rama de origen
        env:
          ORIGEN: ${{ github.head_ref }}
        run: |
          case "$ORIGEN" in
            develop|hotfix/*) echo "Origen permitido: $ORIGEN" ;;
            *) echo "::error::Los cambios llegan a master solo desde develop (o hotfix/*). Origen: $ORIGEN"; exit 1 ;;
          esac
